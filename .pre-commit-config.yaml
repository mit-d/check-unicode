exclude: ^tests/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown, css]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2

  # Python tooling runs from uv.lock rather than from a mirror repo, so a
  # version is never stated twice. --force-exclude makes ruff honour its
  # pyproject excludes even for the filenames pre-commit passes explicitly.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run --frozen ty check src/
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.16.1
    hooks:
      - id: pyproject-fmt

  - repo: local
    hooks:
      - id: check-unicode
        name: Check for uncommon Unicode characters
        # Dogfood the working tree: the uv venv when there is one, otherwise the
        # module directly (the nix dev shell puts src/ on PYTHONPATH).
        entry: >-
          sh -c 'if [ -x .venv/bin/check-unicode ]; then exec
          .venv/bin/check-unicode "$@"; else exec python -m check_unicode "$@";
          fi' --
        language: system
        types: [text]
